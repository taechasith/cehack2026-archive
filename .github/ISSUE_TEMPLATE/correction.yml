name: Project record correction
description: Request a verified correction to a project entry.
title: "[Correction]: "
labels: [data-correction]
body:
  - type: input
    id: submission
    attributes:
      label: Submission ID
      description: Example CEHACK-2026-001
      placeholder: CEHACK-2026-000
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Requested correction
      description: State the current value and the correct replacement.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Verification
      description: Explain your relationship to the project and provide a public reference when possible. Do not post private personal data.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Confirmation
      options:
        - label: I confirm that this request is accurate and does not expose private information.
          required: true
